server {
    listen 80;
    server_name marine-dashboard.duckdns.org;
    return 301 https://main.d3elwno8oxi7lz.amplifyapp.com$request_uri;
}

server {
    listen 443 ssl;
    server_name marine-dashboard.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/marine-dashboard.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marine-dashboard.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://main.d3elwno8oxi7lz.amplifyapp.com$request_uri;
}
