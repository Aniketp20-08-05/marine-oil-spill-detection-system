name: Backend Production Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Find the project directory
            PROJECT_DIR=$(find ~ -name "marine-oil-spill-detection-system" -type d -maxdepth 2 | head -n 1)
            
            if [ -z "$PROJECT_DIR" ]; then
              echo "Project directory not found!"
              exit 1
            fi
            
            echo "Deploying to $PROJECT_DIR"
            cd "$PROJECT_DIR"
            git pull origin main
            
            # Rebuild and restart the backend container
            docker-compose -f docker/docker-compose.yml up -d --build backend
            docker image prune -f
