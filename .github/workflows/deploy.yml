name: Backend Production Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: 'ec2-user'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Find the project directory
            PROJECT_DIR=$(find ~ -name "marine-oil-spill-detection-system" -type d -maxdepth 2 | head -n 1)
            
            if [ -z "$PROJECT_DIR" ]; then
              echo "Project directory not found!"
              exit 1
            fi
            
            echo "Deploying to $PROJECT_DIR"
            cd "$PROJECT_DIR"
            
            # Reset permissions so ec2-user can work
            sudo chown -R ec2-user:ec2-user .
            
            # Fix Git security error
            git config --global --add safe.directory "$PROJECT_DIR"
            
            # Pull latest changes with sudo to be safe
            sudo git pull origin main
            
            # Restart backend manually with sudo for permissions
            cd backend
            sudo pkill -f uvicorn || true
            sleep 2
            sudo nohup python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > log.txt 2>&1 &
            
            # Wait a moment and check if it's running
            sleep 5
            echo "--- Backend Log Snapshot ---"
            tail -n 20 log.txt
            ps aux | grep uvicorn
