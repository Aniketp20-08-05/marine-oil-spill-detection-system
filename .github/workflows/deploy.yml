name: Backend Production Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: 'ec2-user'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Find the project directory
            PROJECT_DIR=$(find ~ -name "marine-oil-spill-detection-system" -type d -maxdepth 2 | head -n 1)
            
            if [ -z "$PROJECT_DIR" ]; then
              echo "Project directory not found!"
              exit 1
            fi
            
            echo "Deploying to $PROJECT_DIR"
            cd "$PROJECT_DIR"
            
            # Fix Git security error
            git config --global --add safe.directory "$PROJECT_DIR"
            
            # Pull latest changes
            git pull origin main
            
            # Restart backend manually (using your confirmed method)
            cd backend
            pkill uvicorn || true
            nohup python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > log.txt 2>&1 &
            echo "Backend restarted successfully"
